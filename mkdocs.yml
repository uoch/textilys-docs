site_name: "Textilys ERP - Guide Utilisateur"
site_url: "https://uoch.github.io/textilys-docs/"
theme:
  name: material
  palette:
    primary: 'blue'
    accent: 'red'
  font:
    text: 'Roboto'
  logo: 'images/logo.png'
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/uoch/textilys-docs
  colors:
    button_primary: '#687B9D'
    button_secondary: '#F96363'
    background_light: '#F7F9FB'
    background_alt: '#E6EEF5'
plugins:
  - search
  - encryptcontent:
      global_password: "Textilys_2026"
      title_prefix: ""        # optional
      summary: "Veuillez entrer le mot de passe pour accéder au guide."
      placeholder: "Mot de passe"
      button_text: "Accéder"

extra_css:
  - ./stylesheets/extra.css

extra_javascript:
  - ./javascripts/extra.js

